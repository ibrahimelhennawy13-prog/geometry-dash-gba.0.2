name: Build GBA ROM

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile GBA ROM
        run: |
          make

      - name: Upload GBA ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry-dash-gba
          path: "*.gba"
